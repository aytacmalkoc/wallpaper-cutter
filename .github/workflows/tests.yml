name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:base
    steps:
      - name: Install runtime and test dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          git python python-gobject python-cairo gtk4 imagemagick
          xorg-server-xvfb xorg-xauth dbus gsettings-desktop-schemas
          adwaita-icon-theme ttf-dejavu desktop-file-utils
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run isolated unit and GTK integration tests
        run: bash tests/run.sh
  portable-contracts:
    name: Portable API contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test portable paths, installation and injected native APIs
        run: python -m unittest discover -s tests -p "test_platform_[nr]*.py" -v
